name: Assignment 10 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assignment10-ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-scan-deploy:
    name: Test → Security Scan → Docker Hub Deploy
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastapi_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastapi_test_db
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastapi_test_db
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # 1. TEST
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Generate JWT test secret
        run: echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start FastAPI server
        run: |
          nohup python -m uvicorn main:app \
            --host 127.0.0.1 --port 8000 > fastapi.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              echo "FastAPI server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::FastAPI server failed to start"
          cat fastapi.log
          exit 1

      - name: Run all tests with 100% coverage
        run: python -m pytest --run-slow -v --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=100

      - name: Show FastAPI logs on test failure
        if: failure()
        run: cat fastapi.log || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: htmlcov/
          if-no-files-found: ignore

      # 2. BUILD AND SCAN
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build -t assignment10:scan .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: assignment10:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"

      # 3. DEPLOY (only successful push to main, never pull requests)
      - name: Verify Docker Hub credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Missing DOCKERHUB_USERNAME variable"; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Missing DOCKERHUB_TOKEN secret"; exit 1; }

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/assignment10"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          docker tag assignment10:scan "${IMAGE}:latest"
          docker tag assignment10:scan "${IMAGE}:sha-${SHORT_SHA}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${SHORT_SHA}"
          echo "Published ${IMAGE}:latest and ${IMAGE}:sha-${SHORT_SHA}"
