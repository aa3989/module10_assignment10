name: Assignment 10 Docker Deployment

on:
  workflow_run:
    workflows: ["Assignment 10 CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Prevent overlapping deployments
concurrency:
  group: assignment10-docker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest

    # Deploy only after successful CI on main
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    steps:
      # Checkout the exact commit that passed testing
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Configure Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build the Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t assignment10:scan \
            .

      # Scan image for security vulnerabilities
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: assignment10:scan
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # Verify Docker Hub credentials are configured
      - name: Verify Docker Hub configuration
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::DOCKERHUB_USERNAME variable is missing"
            exit 1
          fi

          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_TOKEN secret is missing"
            exit 1
          fi

          echo "Docker Hub credentials are configured"

      # Authenticate to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag and publish the Docker image
      - name: Tag and push Docker image
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/assignment10"
          SHORT_SHA="${COMMIT_SHA:0:7}"

          docker tag assignment10:scan "${IMAGE}:latest"
          docker tag assignment10:scan "${IMAGE}:sha-${SHORT_SHA}"

          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${SHORT_SHA}"

          echo "Published ${IMAGE}:latest"
          echo "Published ${IMAGE}:sha-${SHORT_SHA}"
